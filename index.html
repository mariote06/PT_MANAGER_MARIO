  // ---------- OVERLAY / MODAL ----------
  function showOverlay(html){
    let ov = root.querySelector('.overlay');
    if(!ov){
      ov = document.createElement('div');
      ov.className = 'overlay';
      root.appendChild(ov);
    }
    ov.innerHTML = html;
    bindOverlayEvents(ov);
  }
  function removeOverlay(){
    const ov = root.querySelector('.overlay');
    if(ov) ov.remove();
  }

  function showModal(){
    let mb = root.querySelector('.modal-backdrop');
    if(mb) mb.remove();
    if(!state.modal) return;
    mb = document.createElement('div');
    mb.className = 'modal-backdrop';
    mb.innerHTML = renderModal(state.modal);
    root.appendChild(mb);
    bindModalEvents(mb);
  }

  function renderModal(modal){
    const c = getClient(modal.id);
    if(modal.type === 'notificacaoCadernetas'){
      const expiradas = (modal.expiradasIds||[]).map(id => getClient(id)).filter(Boolean);
      const expirando = (modal.expirandoIds||[]).map(id => getClient(id)).filter(Boolean);
      return `
        <div class="modal-sheet">
          <h3>Cadernetas a acompanhar</h3>
          ${expiradas.length > 0 ? `
            <p style="color:var(--coral);font-weight:700;margin:0 0 6px">Expiradas (${expiradas.length})</p>
            ${expiradas.map(cl => `
              <div class="list-item">
                <span>${escapeHtml(cl.nome)}</span>
                <span class="mono" style="color:var(--coral)">${fmtDateShort(cl.cicloValidade)}</span>
              </div>
            `).join('')}
          ` : ''}
          ${expirando.length > 0 ? `
            <p style="color:var(--amber);font-weight:700;margin:16px 0 6px">A expirar na próxima semana (${expirando.length})</p>
            ${expirando.map(cl => `
              <div class="list-item">
                <span>${escapeHtml(cl.nome)}</span>
                <span style="display:flex;align-items:center;gap:8px">
                  <span class="mono" style="color:var(--amber)">${fmtDateShort(cl.cicloValidade)}</span>
                  ${cl.autoRenovar
                    ? `<span class="badge-inline bday">✓ agendada</span>`
                    : `<button class="btn btn-secondary" data-marcar-renovar="${cl.id}" style="width:auto;padding:5px 12px;font-size:11.5px;margin-top:0">Renovar</button>`
                  }
                </span>
              </div>
            `).join('')}
          ` : ''}
          <p style="color:var(--text-muted);font-size:12px;margin:14px 0 0">A renovação não é automática — só acontece quando confirmares aqui, ou individualmente na ficha de cada cliente. Tocar em "Renovar" numa caderneta ainda não expirada agenda-a para renovar sozinha assim que a data chegar, sem pedir confirmação outra vez.</p>
          <div class="btn-row" style="margin-top:16px">
            <button class="btn btn-secondary" id="modalCancel">Fechar</button>
            ${expiradas.length > 0 ? `<button class="btn btn-primary" id="modalConfirmRenovarTodas">Renovar todas as expiradas</button>` : ''}
          </div>
        </div>`;
    }
    if(modal.type === 'editTreino'){
      const ec = getClient(modal.clientId);
      const t = ec ? (ec.treinos||[]).find(x => x.id === modal.treinoId) : null;
      if(!t) return '';
      const clientesOrdenados = state.clients.slice().sort((a,b) => a.nome.localeCompare(b.nome));
      return `
        <div class="modal-sheet">
          <h3>Editar treino</h3>
          <label>Data</label>
          <input type="date" id="m_editTreinoData" value="${t.data}">
          <label>Hora (opcional)</label>
          <input type="time" id="m_editTreinoHora" value="${t.hora||''}">
          <label>Nota</label>
          <input type="text" id="m_editTreinoNota" value="${escapeAttr(t.nota||'')}">
          <label>Cliente</label>
          <select id="m_editTreinoCliente">
            ${clientesOrdenados.map(cc => `<option value="${cc.id}" ${cc.id===ec.id?'selected':''}>${escapeHtml(cc.nome)}</option>`).join('')}
          </select>
          ${t.googleEventId ? '<p style="color:var(--text-muted);font-size:12px;margin:10px 0 0">Este treino veio do Google Calendar. Alterações aqui mantêm-se mesmo que voltes a sincronizar — mas se apagares o evento no Calendar, este treino é removido na sincronização seguinte.</p>' : ''}
          <div class="btn-row" style="margin-top:16px">
            <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
            <button class="btn btn-primary" id="modalConfirmEditTreino">Guardar</button>
          </div>
        </div>`;
    }
    if(modal.type === 'treino'){
      return `
        <div class="modal-sheet">
          <h3>Registar treino</h3>
          <p>Adicionar uma sessão realizada para ${escapeHtml(c.nome)}.</p>
          <label>Data do treino</label>
          <input type="date" id="m_treinoData" value="${todayISO()}">
          <label>Hora (opcional)</label>
          <input type="time" id="m_treinoHora">
          <label>Nota (opcional)</label>
          <input type="text" id="m_treinoNota" placeholder="Ex: treino de força">
          <div class="btn-row" style="margin-top:16px">
            <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
            <button class="btn btn-primary" id="modalConfirmTreino">Registar</button>
          </div>
        </div>`;
    }
    if(modal.type === 'pagamento'){
      const valorSugerido = Number(c.valorCaderneta||0) > 0 ? Number(c.valorCaderneta).toFixed(2) : '';
      return `
        <div class="modal-sheet">
          <h3>Registar pagamento</h3>
          <p>Adicionar um pagamento para ${escapeHtml(c.nome)}.</p>
          <label>Valor (€)</label>
          <input type="number" id="m_pagValor" placeholder="0.00" step="0.01" value="${valorSugerido}">
          <label>Data</label>
          <input type="date" id="m_pagData" value="${todayISO()}">
          <label>Nº de cadernetas cobertas por este pagamento</label>
          <input type="number" id="m_pagCadernetas" value="1" min="1" step="1">
          <p style="color:var(--text-muted);font-size:12px;margin:8px 0 0">Se o pagamento cobrir várias cadernetas de uma vez (ex: 6 pagas adiantado), mete aqui esse número — entra todo no relatório mensal de pagamentos, no mês deste pagamento.</p>
          <label>Nota (opcional)</label>
          <input type="text" id="m_pagNota" placeholder="Ex: renovação caderneta">
          <div class="btn-row" style="margin-top:16px">
            <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
            <button class="btn btn-primary" id="modalConfirmPagamento">Registar</button>
          </div>
        </div>`;
    }
    if(modal.type === 'renovar'){
      const newInicio = c.cicloValidade;
      const newValidade = addDays(newInicio, 28);
      return `
        <div class="modal-sheet">
          <h3>Renovar caderneta</h3>
          <p>Novo ciclo de 4 semanas para ${escapeHtml(c.nome)}: de ${fmtDateShort(newInicio)} até ${fmtDateShort(newValidade)}. O contador de treinos reinicia.</p>
          <div class="btn-row">
            <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
            <button class="btn btn-primary" id="modalConfirmRenovar">Confirmar renovação</button>
          </div>
        </div>`;
    }
    if(modal.type === 'prolongar'){
      return `
        <div class="modal-sheet">
          <h3>Prolongar caderneta</h3>
          <p>Usa isto quando o cliente ainda não fez todos os treinos da caderneta atual. A validade é adiada, mas o ciclo e as sessões feitas mantêm-se.</p>
          <label>Prolongar por quantas semanas?</label>
          <input type="number" id="m_prolongarSemanas" value="1" min="1" max="8">
          <div class="btn-row" style="margin-top:16px">
            <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
            <button class="btn btn-primary" id="modalConfirmProlongar">Confirmar</button>
          </div>
        </div>`;
    }
    if(modal.type === 'deleteClient'){
      return `
        <div class="modal-sheet">
          <h3>Remover cliente</h3>
          <p>Tens a certeza que queres remover ${escapeHtml(c.nome)}? Esta ação não pode ser desfeita.</p>
          <div class="btn-row">
            <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
            <button class="btn btn-danger" id="modalConfirmDelete">Remover</button>
          </div>
        </div>`;
    }
    return '';
  }

  // ---------- EVENTS ----------
  function bindMainEvents(){
    const fab = root.querySelector('#fabAdd');
    if(fab) fab.onclick = () => { state.view = 'add'; state.activeId = null; render(); };

    root.querySelectorAll('[data-nav]').forEach(btn => {
      btn.onclick = () => { state.view = btn.dataset.nav; render(); };
    });

    root.querySelectorAll('[data-open]').forEach(el => {
      el.onclick = () => { state.view = 'detail'; state.activeId = el.dataset.open; render(); };
    });

    const search = root.querySelector('#searchInput');
    if(search){
      search.oninput = (e) => { state.search = e.target.value; renderListOnly(); };
    }

    root.querySelectorAll('[data-filtertipo]').forEach(btn => {
      btn.onclick = () => { state.filterTipo = btn.dataset.filtertipo; render(); };
    });

    const importExcelFile = root.querySelector('#importExcelFile');
    if(importExcelFile) importExcelFile.onchange = async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      if(typeof XLSX === 'undefined'){
        showToast('Biblioteca de Excel não carregou. Verifica a ligação à internet e tenta de novo.');
        e.target.value = '';
        return;
      }
      try{
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(new Uint8Array(buf), {type:'array', cellDates:true});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {defval: null});
        const result = importExcelClients(rows);
        await saveData();
        let msg = `${result.added} cliente(s) adicionado(s)`;
        if(result.skipped) msg += `, ${result.skipped} já existiam (ignorados)`;
        if(result.semNome) msg += `, ${result.semNome} linha(s) sem nome (ignoradas)`;
        showToast(msg);
        render();
      }catch(err){
        console.error(err);
        showToast('Não foi possível ler este ficheiro Excel');
      }
      e.target.value = '';
    };

    root.querySelectorAll('[data-financetab]').forEach(btn => {
      btn.onclick = () => { state.financeTab = btn.dataset.financetab; render(); };
    });

    root.querySelectorAll('[data-monthnav]').forEach(btn => {
      btn.onclick = () => { state.financeMonth = addMonths(state.financeMonth, parseInt(btn.dataset.monthnav)); render(); };
    });

    const btnExportRelatorio = root.querySelector('#btnExportRelatorio');
    if(btnExportRelatorio) btnExportRelatorio.onclick = () => exportRelatorioExcel();

    const btnSaveGoogleClientId = root.querySelector('#btnSaveGoogleClientId');
    if(btnSaveGoogleClientId) btnSaveGoogleClientId.onclick = () => {
      const val = root.querySelector('#googleClientIdInput').value.trim();
      if(!val){ showToast('Cola o Client ID primeiro'); return; }
      saveGoogleClientId(val);
    };

    const btnConnectGoogle = root.querySelector('#btnConnectGoogle');
    if(btnConnectGoogle) btnConnectGoogle.onclick = () => connectGoogleCalendar();

    const btnSyncAllGoogle = root.querySelector('#btnSyncAllGoogle');
    if(btnSyncAllGoogle) btnSyncAllGoogle.onclick = () => syncAllClientsToGoogleCalendar();

    const googleTrainingColorInput = root.querySelector('#googleTrainingColorInput');
    if(googleTrainingColorInput) googleTrainingColorInput.onchange = (e) => saveGoogleTrainingColor(e.target.value);

    const btnImportTreinosGoogle = root.querySelector('#btnImportTreinosGoogle');
    if(btnImportTreinosGoogle) btnImportTreinosGoogle.onclick = () => {
      const days = parseInt(root.querySelector('#googleImportDays').value) || 60;
      importTreinosFromGoogleCalendar(days);
    };

    const btnDisconnectGoogle = root.querySelector('#btnDisconnectGoogle');
    if(btnDisconnectGoogle) btnDisconnectGoogle.onclick = () => disconnectGoogleCalendar();


    const btnSyncNew = root.querySelector('#btnSyncNew');
    if(btnSyncNew) btnSyncNew.onclick = () => connectSyncFile(true);

    const btnSyncExisting = root.querySelector('#btnSyncExisting');
    if(btnSyncExisting) btnSyncExisting.onclick = () => connectSyncFile(false);

    const btnSyncReauth = root.querySelector('#btnSyncReauth');
    if(btnSyncReauth) btnSyncReauth.onclick = () => reauthorizeSyncFile();

    const btnSyncDisconnect = root.querySelector('#btnSyncDisconnect');
    if(btnSyncDisconnect) btnSyncDisconnect.onclick = () => disconnectSyncFile();

    const exportBtn = root.querySelector('#btnExport');
    if(exportBtn) exportBtn.onclick = () => {
      const blob = new Blob([JSON.stringify(state.clients, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `pt_clientes_backup_${todayISO()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Backup descarregado');
    };

    const importFile = root.querySelector('#importFile');
    if(importFile) importFile.onchange = (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try{
          const parsed = JSON.parse(ev.target.result);
          if(!Array.isArray(parsed)) throw new Error('formato inválido');
          state.clients = parsed.map(migrateClient);
          await saveData();
          showToast('Dados importados com sucesso');
          render();
        }catch(err){
          showToast('Ficheiro inválido. Tem de ser um backup exportado por esta app.');
        }
      };
      reader.readAsText(file);
    };
  }

  function renderListOnly(){
    const contentEl = root.querySelector('.content');
    if(contentEl && state.view === 'list'){
      contentEl.innerHTML = renderList();
      root.querySelectorAll('[data-open]').forEach(el => {
        el.onclick = () => { state.view = 'detail'; state.activeId = el.dataset.open; render(); };
      });
    }
  }

  function bindOverlayEvents(ov){
    const back = ov.querySelector('#backBtn');
    if(back) back.onclick = () => { state.view = 'list'; state.activeId = null; render(); };

    const editBtn = ov.querySelector('#editBtn');
    if(editBtn) editBtn.onclick = () => { state.view = 'edit'; render(); };

    const btnTreino = ov.querySelector('#btnRegistarTreino');
    if(btnTreino) btnTreino.onclick = () => { state.modal = {type:'treino', id: state.activeId}; showModal(); };

    const btnRenovar = ov.querySelector('#btnRenovar');
    if(btnRenovar) btnRenovar.onclick = () => { state.modal = {type:'renovar', id: state.activeId}; showModal(); };

    const btnProlongar = ov.querySelector('#btnProlongar');
    if(btnProlongar) btnProlongar.onclick = () => { state.modal = {type:'prolongar', id: state.activeId}; showModal(); };

    const btnAddPag = ov.querySelector('#btnAddPagamento');
    if(btnAddPag) btnAddPag.onclick = () => { state.modal = {type:'pagamento', id: state.activeId}; showModal(); };

    const btnDelete = ov.querySelector('#btnDeleteClient');
    if(btnDelete) btnDelete.onclick = () => { state.modal = {type:'deleteClient', id: state.activeId}; showModal(); };

    ov.querySelectorAll('[data-undo-entry]').forEach(btn => {
      btn.onclick = async () => {
        const c = getClient(state.activeId);
        const ok = undoSpecificChange(c, btn.dataset.undoEntry);
        if(ok){
          await saveData();
          showToast('Alteração desfeita');
          render();
        }
      };
    });

    ov.querySelectorAll('[data-edit-treino]').forEach(el => {
      el.onclick = () => { state.modal = { type: 'editTreino', clientId: state.activeId, treinoId: el.dataset.editTreino }; showModal(); };
    });

    ov.querySelectorAll('[data-del-treino]').forEach(b => {
      b.onclick = async () => {
        const c = getClient(state.activeId);
        c.treinos = (c.treinos||[]).filter(t => t.id !== b.dataset.delTreino);
        await saveData();
        render();
      };
    });
    ov.querySelectorAll('[data-del-pag]').forEach(b => {
      b.onclick = async () => {
        const c = getClient(state.activeId);
        c.pagamentos = (c.pagamentos||[]).filter(p => p.id !== b.dataset.delPag);
        await saveData();
        render();
      };
    });

    const saveBtn = ov.querySelector('#btnSaveClient');
    if(saveBtn) saveBtn.onclick = async () => {
      const nome = ov.querySelector('#f_nome').value.trim();
      if(!nome){ showToast('O nome é obrigatório'); return; }
      const data = {
        nome,
        sexo: ov.querySelector('#f_sexo').value,
        nascimento: ov.querySelector('#f_nascimento').value,
        contacto: ov.querySelector('#f_contacto').value.trim(),
        email: ov.querySelector('#f_email').value.trim(),
        atividade: ov.querySelector('#f_atividade').value.trim(),
        sessoesEsperadas: parseInt(ov.querySelector('#f_sessoes').value) || 4,
        cicloInicio: ov.querySelector('#f_inicio').value || todayISO(),
        cicloValidade: ov.querySelector('#f_validade').value || addDays(todayISO(),28),
        inicioCadernetaAtual: ov.querySelector('#f_inicioCaderneta').value || addDays(ov.querySelector('#f_validade').value || todayISO(), -28),
        tipo: ov.querySelector('#f_tipo').value,
        servico: ov.querySelector('#f_servico').value,
        valorCaderneta: parseFloat(ov.querySelector('#f_valorCaderneta').value) || 0,
        pagoAte: ov.querySelector('#f_pagoAte').value || '',
      };
      if(state.view === 'edit'){
        const c = getClient(state.activeId);
        const changes = [];
        Object.keys(data).forEach(key => {
          if(JSON.stringify(c[key]) !== JSON.stringify(data[key])){
            changes.push({ campo: key, rotulo: CAMPO_LABELS[key] || key, antes: c[key], depois: data[key] });
          }
        });
        if(changes.length) logChange(c, 'Edição de ficha', changes);
        Object.assign(c, data);
        await saveData();
        showToast('Alterações guardadas');
        state.view = 'detail';
      } else {
        const nc = { id: uid(), treinos: [], pagamentos: [], historico: [], ativo: true, ...data };
        state.clients.push(nc);
        await saveData();
        showToast('Cliente adicionado');
        state.activeId = nc.id;
        state.view = 'detail';
      }
      render();
    };

    // auto-suggest sessions when atividade changes on add/edit form
    const atividadeInput = ov.querySelector('#f_atividade');
    if(atividadeInput){
      atividadeInput.addEventListener('blur', () => {
        const sessoesInput = ov.querySelector('#f_sessoes');
        if(sessoesInput && !sessoesInput.dataset.touched){
          sessoesInput.value = parseSessions(atividadeInput.value);
        }
      });
      const sessoesInput = ov.querySelector('#f_sessoes');
      if(sessoesInput) sessoesInput.addEventListener('input', () => sessoesInput.dataset.touched = '1');
    }

    // auto-suggest valor da caderneta a partir do serviço (PT 60 = 34€/sessão, PT 30 = 23€/sessão)
    const servicoInput = ov.querySelector('#f_servico');
    const valorCadernetaInput = ov.querySelector('#f_valorCaderneta');
    const sessoesInputForValor = ov.querySelector('#f_sessoes');
    if(valorCadernetaInput){
      valorCadernetaInput.addEventListener('input', () => valorCadernetaInput.dataset.touched = '1');
      const trySuggestValor = () => {
        if(valorCadernetaInput.dataset.touched) return;
        const servico = servicoInput ? servicoInput.value : null;
        const sessoes = parseInt(sessoesInputForValor ? sessoesInputForValor.value : 0) || 0;
        const sugestao = suggestValorCaderneta(servico, sessoes);
        if(sugestao !== null) valorCadernetaInput.value = sugestao;
      };
      if(servicoInput) servicoInput.addEventListener('change', trySuggestValor);
      if(sessoesInputForValor) sessoesInputForValor.addEventListener('input', trySuggestValor);
    }
  }

  function bindModalEvents(mb){
    const cancel = mb.querySelector('#modalCancel');
    if(cancel) cancel.onclick = () => { state.modal = null; showModal(); };

    mb.onclick = (e) => { if(e.target === mb){ state.modal = null; showModal(); } };

    const confirmRenovarTodas = mb.querySelector('#modalConfirmRenovarTodas');
    if(confirmRenovarTodas) confirmRenovarTodas.onclick = async () => {
      const ids = state.modal.expiradasIds || [];
      await renewAllExpiredClients(ids);
      state.modal = null;
      showToast(`${ids.length} caderneta(s) renovada(s)`);
      render();
    };

    mb.querySelectorAll('[data-marcar-renovar]').forEach(btn => {
      btn.onclick = async () => {
        const cl = getClient(btn.dataset.marcarRenovar);
        if(cl){
          cl.autoRenovar = true;
          await saveData();
          showToast(`${cl.nome.split(' ')[0]}: renovação agendada`);
          showModal(); // volta a desenhar o mesmo modal, agora com "✓ agendada"
        }
      };
    });

    const confirmEditTreino = mb.querySelector('#modalConfirmEditTreino');
    if(confirmEditTreino) confirmEditTreino.onclick = async () => {
      const oldClient = getClient(state.modal.clientId);
      const treino = (oldClient.treinos||[]).find(t => t.id === state.modal.treinoId);
      if(!treino){ state.modal = null; render(); return; }
      const novaData = mb.querySelector('#m_editTreinoData').value || treino.data;
      const novaHora = mb.querySelector('#m_editTreinoHora').value || '';
      const novaNota = mb.querySelector('#m_editTreinoNota').value.trim();
      const novoClienteId = mb.querySelector('#m_editTreinoCliente').value;
      treino.data = novaData;
      treino.hora = novaHora;
      treino.nota = novaNota;
      if(novoClienteId !== oldClient.id){
        oldClient.treinos = oldClient.treinos.filter(t => t.id !== treino.id);
        const newClient = getClient(novoClienteId);
        newClient.treinos = newClient.treinos || [];
        newClient.treinos.push(treino);
        state.activeId = novoClienteId;
      }
      await saveData();
      state.modal = null;
      showToast('Treino atualizado');
      render();
    };

    const confirmTreino = mb.querySelector('#modalConfirmTreino');
    if(confirmTreino) confirmTreino.onclick = async () => {
      const c = getClient(state.modal.id);
      const data = mb.querySelector('#m_treinoData').value || todayISO();
      const hora = mb.querySelector('#m_treinoHora').value || '';
      const nota = mb.querySelector('#m_treinoNota').value.trim();
      c.treinos = c.treinos || [];
      c.treinos.push({id: uid(), data, hora, nota});
      await saveData();
      state.modal = null;
      showToast('Treino registado');
      render();
    };

    const confirmPag = mb.querySelector('#modalConfirmPagamento');
    if(confirmPag) confirmPag.onclick = async () => {
      const c = getClient(state.modal.id);
      const valor = parseFloat(mb.querySelector('#m_pagValor').value) || 0;
      const data = mb.querySelector('#m_pagData').value || todayISO();
      const cadernetas = parseInt(mb.querySelector('#m_pagCadernetas').value) || 1;
      const nota = mb.querySelector('#m_pagNota').value.trim();
      c.pagamentos = c.pagamentos || [];
      c.pagamentos.push({id: uid(), valor, data, cadernetas, nota});
      await saveData();
      state.modal = null;
      showToast('Pagamento registado');
      render();
    };

    const confirmRenovar = mb.querySelector('#modalConfirmRenovar');
    if(confirmRenovar) confirmRenovar.onclick = async () => {
      const c = getClient(state.modal.id);
      const antesInicioCaderneta = inicioCaderneta(c), antesValidade = c.cicloValidade;
      const novoInicioCaderneta = c.cicloValidade;
      const novaValidade = addDays(novoInicioCaderneta, 28);
      logChange(c, 'Renovação de caderneta', [
        { campo: 'inicioCadernetaAtual', rotulo: 'Início da Caderneta', antes: antesInicioCaderneta, depois: novoInicioCaderneta },
        { campo: 'cicloValidade', rotulo: 'Validade', antes: antesValidade, depois: novaValidade }
      ]);
      c.inicioCadernetaAtual = novoInicioCaderneta;
      c.cicloValidade = novaValidade;
      if(c.googleEventId && googleAuth.token) await syncClientToGoogleCalendar(c);
      await saveData();
      state.modal = null;
      showToast('Caderneta renovada');
      render();
    };

    const confirmProlongar = mb.querySelector('#modalConfirmProlongar');
    if(confirmProlongar) confirmProlongar.onclick = async () => {
      const c = getClient(state.modal.id);
      const semanas = parseInt(mb.querySelector('#m_prolongarSemanas').value) || 1;
      const antes = c.cicloValidade;
      const nova = addDays(c.cicloValidade, semanas*7);
      logChange(c, `Prolongamento (+${semanas} semana(s))`, [
        { campo: 'cicloValidade', rotulo: 'Validade', antes, depois: nova }
      ]);
      c.cicloValidade = nova;
      if(c.googleEventId && googleAuth.token) await syncClientToGoogleCalendar(c);
      await saveData();
      state.modal = null;
      showToast(`Caderneta prolongada por ${semanas} semana(s)`);
      render();
    };


    const confirmDelete = mb.querySelector('#modalConfirmDelete');
    if(confirmDelete) confirmDelete.onclick = async () => {
      state.clients = state.clients.filter(c => c.id !== state.modal.id);
      await saveData();
      state.modal = null;
      state.view = 'list';
      state.activeId = null;
      showToast('Cliente removido');
      render();
    };
  }

  function escapeHtml(s){
    return String(s??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  initGoogleAuth();
  loadData().then(() => tryAutoConnectGoogle());
})();
</script>
</div>

</body>
